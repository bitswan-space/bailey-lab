# A private FastAPI worker: never exposed to the internet, reached only by the
# frontend's shim over the Docker network (/api → this worker) and by peer
# workers. Python-native, so it suits ML / data workloads that aren't a good
# fit for the Go worker. Ships with no infrastructure dependencies — add
# [services.postgres] / [services.minio] here if the workload needs them.
[deployment]
expose = false
port = 8080
# Memory budget for this container. Tune memory-reservation to just above real
# peak; it is required before promoting to staging/production. ML/data workloads
# often need more than the frontend default.
memory-reservation = 256                 # MB
# on-demand = paused when idle + woken on access with the frontend (default);
# always-on = never auto-shut-down (use if this worker runs background/scheduled
# work with no inbound request to wake it).
memory_reservation_policy = "on-demand"
