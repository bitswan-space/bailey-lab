# The frontend is the only part of the business process exposed through
# Bailey. It serves the React app (vite) and its Go shim proxies /api to the
# private backend worker (see image/shim). Access is controlled by the Bailey
# share button + the workspace ACL — there is no expose_to.
[deployment]
expose = true
# Memory budget for this container. Tune memory-reservation to just above real
# peak; it is required before promoting to staging/production.
memory-reservation = 128                 # MB
# on-demand = paused when idle + woken on access (default); always-on = never
# auto-shut-down (rarely needed for a request-serving frontend).
memory_reservation_policy = "on-demand"
