# The Go backend is a private worker: never exposed to the internet, reached
# only by the frontend's shim over the Docker network (and by peer workers).
# Its postgres + minio dependencies are provisioned per business process.
[deployment]
expose = false
# Memory budget for this container. Tune memory-reservation to just above real
# peak; it is required before promoting to staging/production.
memory-reservation = 128                 # MB
# on-demand = paused when idle + woken on access; always-on = never
# auto-shut-down. The backend worker is always-on: it does background processing
# with no inbound request to wake it, and keeping it resident means a promoted
# stage always has a live, inspectable container (not one evicted under memory
# pressure). Switch to "on-demand" for a worker that only runs on request.
memory_reservation_policy = "always-on"

[services.postgres]
enabled = true

[services.minio]
enabled = true
