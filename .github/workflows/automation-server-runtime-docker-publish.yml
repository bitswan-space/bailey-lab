name: automation-server runtime Build and Push Docker Image

# The image the daemon container runs. The daemon bind-mounts the host `bitswan`
# binary read-only, so this image supplies only the tooling around it (git,
# ssh-keygen, docker-cli, mkcert, restic) — which is exactly why it needs
# publishing on its own: a server can update its binary and still be missing
# something only the image provides.
#
# Nothing published it before this workflow existed, so the Hub tag was frozen at
# whenever it was last pushed by hand, and Dockerfile changes never reached any
# deployment. Paths are scoped to what actually goes INTO the image, so an
# ordinary Go change does not rebuild it.

on:
  push:
    branches: [ main ]
    paths:
      - 'bitswan-automation-server/Dockerfile'
      - 'bitswan-automation-server/build_and_publish_daemon.sh'
      - '.github/workflows/automation-server-runtime-docker-publish.yml'
  # The image pins tool versions rather than tracking this repo's code, so it also
  # needs a way to be rebuilt on demand — for a restic bump or a base-image CVE
  # with no accompanying source change.
  workflow_dispatch:

defaults:
  run:
    working-directory: bitswan-automation-server

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    - name: Check out the repo
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_ACCESS_TOKEN }}

    - name: Build and Push
      run: bash build_and_publish_daemon.sh

    - name: Verify the tooling the daemon relies on is present
      # The image existing is not the same as the image being usable. restic in
      # particular is invoked by the daemon as a bare `restic` on PATH, so a
      # Dockerfile change that silently drops it would publish green and only
      # surface at 02:00 as a failed backup on every server that pulled it.
      run: |
        docker run --rm --entrypoint sh bitswan/automation-server-runtime:latest -c '
          set -e
          for tool in restic git docker mkcert ssh-keygen; do
            command -v "$tool" >/dev/null || { echo "MISSING: $tool"; exit 1; }
          done
          echo "restic: $(restic version)"
        '
