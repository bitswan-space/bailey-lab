name: gitops Lint & Test

on:
  push:
    paths:
      - 'bitswan-gitops/**'
      - '.github/workflows/gitops-lint.yml'
  pull_request:
    paths:
      - 'bitswan-gitops/**'
      - '.github/workflows/gitops-lint.yml'

defaults:
  run:
    working-directory: bitswan-gitops

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: pip install .[dev]

    - name: Run linter
      run: |
        # Neither line takes a path: both walk the whole package. `ruff check app`
        # used to stop at the package boundary, so `tests` was formatted-checked
        # but never linted, and dead assignments sat there unseen (#473).
        ruff check
        ruff format --check

    - name: Run tests
      run: pytest tests -v

  # The worker examples are what a deployed automation actually runs, and they
  # carry the token-verification contract every app inherits. Nothing ran their
  # tests before, so a change to how identities are checked could pass CI
  # untouched.
  examples:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example:
          - examples/business-process/backend
          - examples/go-worker
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-go@v5
      with:
        go-version: '1.25'

    - name: Test ${{ matrix.example }}
      run: |
        # Each example resolves its module from /deps at image-build time, so the
        # go.mod in the checkout is a symlink that dangles anywhere but inside the
        # build image. Reassemble the layout the image gives it.
        work="$(mktemp -d)"
        cp -r "${{ matrix.example }}/." "$work/"
        rm -f "$work/go.mod" "$work/go.sum"
        cp "${{ matrix.example }}/image/go.mod" "$work/go.mod"
        cd "$work"
        go mod tidy
        go test ./
