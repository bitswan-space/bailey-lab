name: infra-driver Build and Push Docker Image

on:
  push:
    branches: [ main ]
    paths:
      # The image is `COPY . .` over the whole automation-server module and
      # compiles ./cmd/infra-driver, so any Go change can affect the binary.
      # Build broadly rather than risk shipping a stale driver.
      - 'bitswan-automation-server/**'
      - '.github/workflows/infra-driver-docker-publish.yml'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    - name: Check out the repo
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_ACCESS_TOKEN }}

    - name: Build and Push
      working-directory: bitswan-automation-server
      # Publishes bitswan/infra-driver-staging with the same three-tag versioned
      # scheme as gitops/workspace-dashboard/coding-agent; the version tag is what
      # dockerhub.ResolveInfraDriverImage(staging) pins.
      run: bash ./cmd/infra-driver/build_and_push.sh
