name: infra-driver Build and Push Docker Image

on:
  push:
    branches: [ main ]
    paths:
      # The image is `COPY . .` over the whole automation-server module and
      # compiles ./cmd/infra-driver, so any Go change can affect the binary.
      # Build broadly rather than risk shipping a stale driver.
      - 'bitswan-automation-server/**'
      - '.github/workflows/infra-driver-docker-publish.yml'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    - name: Check out the repo
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_ACCESS_TOKEN }}

    - name: Build and Push
      run: |
        # The per-workspace infra-driver sidecar references this image by
        # BITSWAN_INFRA_DRIVER_IMAGE, which defaults to bitswan/infra-driver:latest
        # — publish exactly that tag (plus an immutable build-stamped tag) or every
        # workspace's driver can't pull it.
        # Build context = the bitswan-automation-server module root.
        YEAR=$(date +%Y)
        COMMIT_HASH=$(git rev-parse --short HEAD)
        IMAGE_TAG="bitswan/infra-driver"

        docker build \
          -t $IMAGE_TAG:latest \
          -t $IMAGE_TAG:$YEAR-${GITHUB_RUN_ID}-git-$COMMIT_HASH \
          -f bitswan-automation-server/cmd/infra-driver/Dockerfile \
          bitswan-automation-server

        docker push $IMAGE_TAG:latest
        docker push $IMAGE_TAG:$YEAR-${GITHUB_RUN_ID}-git-$COMMIT_HASH
