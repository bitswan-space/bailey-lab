name: automation-server CalVer Release

on:
  push:
    branches: [main]
    paths:
      - 'bitswan-automation-server/**'
      - '.github/workflows/automation-server-release.yml'

permissions:
  contents: write
  packages: write
  actions: read # read the bp-lifecycle-e2e run to download its handbook artifact

env:
  # Add your binary name once—used in several steps
  APP_NAME: bitswan-automation-server

defaults:
  run:
    working-directory: bitswan-automation-server

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      # 1) Checkout full history (tags included)
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2) Set up Go tool-chain
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      # 3) Produce a Calendar Version string
      - name: Generate CalVer
        id: calver
        run: |
          DATE_VERSION=$(date +%Y.%m.%d)
          BUILD_NUMBER=${{ github.run_number }}
          echo "version=${DATE_VERSION}.${BUILD_NUMBER}" >> "$GITHUB_OUTPUT"

      # 4) Make and push the tag
      - name: Create & push Git tag
        env:
          VERSION: ${{ steps.calver.outputs.version }}
        run: |
          git config --local user.email "action@example.com"
          git config --local user.name  "GitHub Action"
          git tag "v$VERSION"
          git push origin "v$VERSION"

      # 4.5) Build the embedded Server Console SPA. Its build output is not
      # committed (the daemon pulls it in via `go:embed serverconsole_dist`),
      # so without this step the released binary embeds only the .gitkeep
      # placeholder and bailey.<domain> / bailey-onboard.<domain> render an
      # empty directory listing instead of the console. Mirrors the test and
      # coverage workflows.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # The Operator's Handbook (HTML + PDF, with real product screenshots) is
      # GENERATED by the BP-lifecycle E2E walkthrough and published as the
      # `operators-handbook` artifact — never committed to git. Bake the newest
      # one into the embedded console here, so the shipped binary always carries
      # the freshest handbook without a stale, churning 20 MB blob in the tree.
      # Best-effort: if no artifact is available the console still builds (the
      # Handbook nav links just 404 until the next E2E run produces one).
      - name: Bake in the latest handbook (generated by the E2E)
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          dest="bitswan-server-console/public/handbook"
          mkdir -p "$dest"
          run_id="$(gh run list --workflow bp-lifecycle-e2e.yml --status success \
            --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
          if [ -z "$run_id" ]; then
            echo "::warning::no successful bp-lifecycle-e2e run found — shipping without a handbook"
            exit 0
          fi
          tmp="$(mktemp -d)"
          if gh run download "$run_id" -n operators-handbook -D "$tmp"; then
            cp -f "$tmp/handbook.html" "$dest/handbook.html"
            [ -f "$tmp/handbook.pdf" ] && cp -f "$tmp/handbook.pdf" "$dest/handbook.pdf" || true
            echo "Baked handbook from bp-lifecycle-e2e run $run_id into $dest"
            ls -la "$dest"
          else
            echo "::warning::could not download operators-handbook from run $run_id — shipping without a handbook"
          fi

      - name: Build Server Console (embedded SPA)
        working-directory: ${{ github.workspace }}
        run: make -C bitswan-automation-server console

      # 5) Build the shipped target
      - name: Build binaries
        env:
          VERSION: ${{ steps.calver.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          # Targets you want to ship. Only linux/amd64 is built: the daemon runs
          # in a linux/amd64 container and the host CLI is used on the same box,
          # so the other triples aren't shipped (some daemon code is Linux-only).
          TARGETS=(
            "linux/amd64"
          )
          for target in "${TARGETS[@]}"; do
            IFS="/" read -r GOOS GOARCH <<<"$target"
            BIN_NAME="${APP_NAME}-v${VERSION}-${GOOS}-${GOARCH}"
            EXT=""
            if [[ "$GOOS" == "windows" ]]; then EXT=".exe"; fi

            echo "→ building $BIN_NAME$EXT"
            CGO_ENABLED=0 GOOS=$GOOS GOARCH=$GOARCH \
              go build -trimpath -ldflags "-X main.version=$VERSION -w -s -extldflags '-static'" \
              -a \
              -o "dist/$BIN_NAME$EXT" .

            # Compress
            if [[ "$GOOS" == "windows" ]]; then
              zip -j "dist/$BIN_NAME.zip" "dist/$BIN_NAME$EXT"
              rm "dist/$BIN_NAME$EXT"
            else
              tar -C dist -czf "dist/$BIN_NAME.tar.gz" "$BIN_NAME$EXT"
              rm "dist/$BIN_NAME$EXT"
            fi
          done

      # 6) Checksums (and optional signing)
      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > "${APP_NAME}_checksums.txt"

      # 7) Create the Release and upload every file in dist/
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION:   ${{ steps.calver.outputs.version }}
        run: |
          gh release create "v$VERSION" \
            --title "v$VERSION" \
            --notes "Automated CalVer release" \
            dist/*

      # 9) (Optional) Publish OCI images, Homebrew formula, etc.—add more steps here


