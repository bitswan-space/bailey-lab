networks:
    bitswan_network:
        external: true
    ws3-staging:
        external: true
services:
    minio-staging:
        command: server /data --console-address :9001
        container_name: ws3__minio-staging
        env_file:
            - __ROOT__/secrets/minio-staging
        healthcheck:
            interval: 5s
            retries: 30
            start_interval: 250ms
            start_period: 15s
            test:
                - CMD
                - curl
                - -f
                - http://localhost:9000/minio/health/live
            timeout: 3s
        image: minio/minio:latest
        labels:
            gitops.workspace: ws3
        networks:
            - ws3-staging
        restart: unless-stopped
        volumes:
            - ws3-minio-staging-data-data:/data
    postgres-staging:
        container_name: ws3__postgres-staging
        env_file:
            - __ROOT__/secrets/postgres-staging
        healthcheck:
            interval: 5s
            retries: 30
            start_interval: 250ms
            start_period: 30s
            test:
                - CMD-SHELL
                - pg_isready -U "$POSTGRES_USER" -q
            timeout: 3s
        image: postgres:16
        labels:
            gitops.workspace: ws3
        networks:
            - ws3-staging
        restart: unless-stopped
        volumes:
            - ws3-postgres-staging-data-data:/var/lib/postgresql/data
    postgres-staging-pgadmin:
        container_name: ws3__postgres-staging-pgadmin
        env_file:
            - __ROOT__/secrets/postgres-staging
        environment:
            PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
            PGADMIN_CONFIG_SERVER_MODE: "False"
        image: dpage/pgadmin4:latest
        labels:
            gitops.workspace: ws3
        networks:
            - ws3-staging
        restart: unless-stopped
        volumes:
            - __ROOT__/secrets/pgadmin-servers.json:/pgadmin4/servers.json:ro
    ws3-backend-822b-staging:
        cap_drop:
            - NET_ADMIN
            - NET_RAW
        container_name: ws3-backend-822b-staging
        depends_on:
            ws3-fwgw-822b-staging:
                condition: service_healthy
        env_file:
            - __ROOT__/secrets/bp/acme/staging
            - __ROOT__/secrets/postgres-staging
            - __ROOT__/secrets/minio-staging
        environment:
            BITSWAN_ADMIN_GROUP: /Test Org/admin
            BITSWAN_ALLOWED_GROUP: /Test Org
            BITSWAN_AUTH_MODE: aoc
            BITSWAN_AUTOMATION_STAGE: staging
            BITSWAN_DEPLOY_CHECKSUM: bk
            BITSWAN_DEPLOYMENT_CONTEXT: acme-staging
            BITSWAN_DEPLOYMENT_ID: backend-acme-staging
            BITSWAN_GITOPS_DOMAIN: example.com
            BITSWAN_URL_TEMPLATE: https://ws3-{name}-822b-staging.example.com
            BITSWAN_WORKER_HOSTS: backend=ws3-fwgw-822b-staging:8081
            BITSWAN_WORKSPACE_NAME: ws3
            DEPLOYMENT_ID: backend-acme-staging
            KEYCLOAK_ISSUER_URL: https://keycloak.example.com/realms/testrealm
            KEYCLOAK_REALM: testrealm
            KEYCLOAK_URL: https://keycloak.example.com
            PORT: "8081"
        image: internal/ws3-acme-backend:shabk
        labels:
            gitops.automation_name: backend
            gitops.bp: acme
            gitops.context: acme
            gitops.deployment_id: backend-acme-staging
            gitops.intended_exposed: "false"
            gitops.mem_policy: on-demand
            gitops.mem_reservation_mb: "50"
            gitops.slot: ""
            gitops.stage: staging
            gitops.workspace: ws3
        network_mode: service:ws3-fwgw-822b-staging
        restart: always
        ulimits:
            nofile:
                hard: 65536
                soft: 65536
        volumes: []
    ws3-frontend-822b-staging:
        cap_drop:
            - NET_ADMIN
            - NET_RAW
        container_name: ws3-frontend-822b-staging
        depends_on:
            ws3-fwgw-822b-staging:
                condition: service_healthy
        env_file:
            - __ROOT__/secrets/postgres-staging
            - __ROOT__/secrets/minio-staging
        environment:
            BITSWAN_ADMIN_GROUP: /Test Org/admin
            BITSWAN_ALLOWED_GROUP: /Test Org
            BITSWAN_AUTH_MODE: aoc
            BITSWAN_AUTOMATION_STAGE: staging
            BITSWAN_AUTOMATION_URL: https://ws3-frontend-822b-staging.example.com
            BITSWAN_DEPLOY_CHECKSUM: fr
            BITSWAN_DEPLOYMENT_CONTEXT: acme-staging
            BITSWAN_DEPLOYMENT_ID: frontend-acme-staging
            BITSWAN_GITOPS_DOMAIN: example.com
            BITSWAN_URL_PREFIX: https://ws3-
            BITSWAN_URL_SUFFIX: .example.com
            BITSWAN_URL_TEMPLATE: https://ws3-{name}-822b-staging.example.com
            BITSWAN_WORKER_HOSTS: backend=ws3-fwgw-822b-staging:8081
            BITSWAN_WORKSPACE_NAME: ws3
            DEPLOYMENT_ID: frontend-acme-staging
            KEYCLOAK_ISSUER_URL: https://keycloak.example.com/realms/testrealm
            KEYCLOAK_REALM: testrealm
            KEYCLOAK_URL: https://keycloak.example.com
        image: internal/ws3-acme-frontend:shafr
        labels:
            gitops.automation_name: frontend
            gitops.bp: acme
            gitops.context: acme
            gitops.deployment_id: frontend-acme-staging
            gitops.intended_exposed: "true"
            gitops.mem_policy: on-demand
            gitops.mem_reservation_mb: "50"
            gitops.slot: ""
            gitops.stage: staging
            gitops.workspace: ws3
        network_mode: service:ws3-fwgw-822b-staging
        restart: always
        ulimits:
            nofile:
                hard: 65536
                soft: 65536
        volumes: []
    ws3-fwgw-822b-staging:
        cap_add:
            - NET_ADMIN
        container_name: ws3-fwgw-822b-staging
        depends_on:
            ws3-fwgw-822b-staging-proxy:
                condition: service_healthy
        environment:
            BITSWAN_FW_MODE: enforce
            BITSWAN_FW_PROXY: ws3-fwgw-822b-staging-proxy
            BITSWAN_FW_ROLE: owner
        healthcheck:
            interval: 3s
            retries: 10
            start_period: 2s
            test:
                - CMD-SHELL
                - test -f /tmp/fw-ready
            timeout: 3s
        image: bitswan/egress-gateway:latest
        labels:
            gitops.bp: acme
            gitops.context: acme
            gitops.firewall_gateway: "true"
            gitops.slot: ""
            gitops.stage: staging
            gitops.workspace: ws3
        networks:
            ws3-staging:
                aliases:
                    - ws3-fwgw-822b-staging
        pull_policy: missing
        restart: unless-stopped
    ws3-fwgw-822b-staging-proxy:
        container_name: ws3-fwgw-822b-staging-proxy
        environment:
            BITSWAN_FW_ALLOW: ""
            BITSWAN_FW_ATTEMPTS: /firewall/acme__staging.attempts.jsonl
            BITSWAN_FW_MODE: enforce
            BITSWAN_FW_ROLE: proxy
        healthcheck:
            interval: 3s
            retries: 10
            start_period: 2s
            test:
                - CMD-SHELL
                - nc -z 127.0.0.1 18077
            timeout: 3s
        image: bitswan/egress-gateway:latest
        labels:
            gitops.bp: acme
            gitops.context: acme
            gitops.firewall_proxy: "true"
            gitops.slot: ""
            gitops.stage: staging
            gitops.workspace: ws3
        networks:
            ws3-staging:
                aliases:
                    - ws3-fwgw-822b-staging-proxy
        pull_policy: missing
        restart: unless-stopped
        volumes:
            - __ROOT__/firewall:/firewall
version: "3"
volumes:
    ws3-minio-staging-data-data: null
    ws3-postgres-staging-data-data: null
